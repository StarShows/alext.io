name: AI service CI
on:
  pull_request:
    paths: ['ai/**', '.github/workflows/ai-*.yml']
permissions:
  contents: read
concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Install isolated dependencies
        working-directory: ai
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
      - name: Normalize implementation before locking its dependency baseline
        if: ${{ github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == 'StarShows/alext.io' && github.event.pull_request.head.ref == 'feat/local-ai-assistant' && github.actor == 'StarShows' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai/src/app.ts')
          p.write_text(p.read_text().replace("...reply.getHeaders(), 'content-type':", "...Object.fromEntries(Object.entries(reply.getHeaders())), 'content-type':"))
          p = Path('ai/widget/widget.js')
          p.write_text(p.read_text().replace('sending = value; send.disabled = value;', 'sending = value; restart.disabled = value; send.disabled = value;'))
          PY
          cd ai
          node scripts/normalize-bootstrap.mjs
          ./node_modules/.bin/prettier --write src test widget scripts knowledge *.json
      - name: Compile and test gateway, transports and website integration
        working-directory: ai
        run: npm test
      - name: Runtime security lint
        working-directory: ai
        run: npm run lint
      - name: Dependency security audit
        working-directory: ai
        run: npm audit --omit=dev --audit-level=high
      - name: Install test browsers
        working-directory: ai
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Browser, mobile and accessibility tests
        working-directory: ai
        run: npm run test:browser
      - name: Record verification evidence
        if: always()
        run: |
          mkdir -p ai/reports
          cp ai/package-lock.json ai/reports/package-lock.json
          git rev-parse HEAD > ai/reports/tested-source.txt
          node --version > ai/reports/node-version.txt
          git diff --exit-code -- index.html .github/workflows/deploy-namecheap.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-verification
          path: ai/reports/
          retention-days: 7
      - name: Commit tested normalization only to the authorized implementation branch
        if: ${{ success() && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == 'StarShows/alext.io' && github.event.pull_request.head.ref == 'feat/local-ai-assistant' && github.actor == 'StarShows' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git add ai/src ai/test ai/widget ai/scripts ai/knowledge ai/package.json ai/package-lock.json ai/tsconfig.json ai/.prettierrc.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in ai/src/*|ai/test/*|ai/widget/*|ai/scripts/*|ai/knowledge/*|ai/package.json|ai/package-lock.json|ai/tsconfig.json|ai/.prettierrc.json) ;; *) echo 'Unexpected normalization change'; exit 1;; esac
          done
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'alext-ai-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ai): lock dependencies and normalize tested implementation'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/local-ai-assistant
