name: AI service CI
on:
  pull_request:
    paths: ['ai/**', '.github/workflows/ai-*.yml']
permissions:
  contents: read
concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Resolve pinned dependencies (bootstrap only; lockfile follows)
        working-directory: ai
        run: npm install --ignore-scripts --no-fund
      - name: Compile and test gateway
        working-directory: ai
        run: npm test
      - name: Runtime security lint
        working-directory: ai
        run: npm run lint
      - name: Dependency security audit
        working-directory: ai
        run: npm audit --omit=dev --audit-level=high
      - name: Record exact source and dependency baseline
        if: always()
        run: |
          mkdir -p baseline
          cp ai/package-lock.json baseline/package-lock.json
          git rev-parse HEAD > baseline/commit.txt
          node --version > baseline/node-version.txt
          git diff --exit-code -- index.html .github/workflows/deploy-namecheap.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-verification-baseline
          path: baseline/
          retention-days: 7
