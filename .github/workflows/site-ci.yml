name: Site security and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate static site and deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compile CSS without install scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build-css
      - name: Parse tracked JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z -- '*.js')
      - name: Generate browser and social media images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          "$RUNNER_TEMP/brand-venv/bin/python" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: Pillow==11.3.0
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/deploy/generate_brand_assets.py
      - name: Capture current project websites for local fallback previews
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/brand-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: playwright==1.56.0
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/deploy/generate_portal_previews.py --mode capture
      - name: Validate scripts, tests, and release archive
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy/remote_deploy.sh scripts/deploy/remote_rollback.sh
          "$RUNNER_TEMP/brand-venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/deploy/package_site.py --out "$RUNNER_TEMP/site-release.tar.gz"
          tar -tzf "$RUNNER_TEMP/site-release.tar.gz" > /dev/null
      - name: Desktop and mobile browser interaction smoke tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/brand-venv/bin/python" tests/browser_smoke.py
      - name: Save preview images for PR review
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: recruiter-project-previews
          path: images/previews/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Save desktop and mobile screenshot QA
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: recruiter-search-ui-qa
          path: tests/screenshots/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
