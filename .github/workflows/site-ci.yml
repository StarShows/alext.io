name: Site security and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate static site and deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compile CSS without install scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build-css
      - name: Parse tracked JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z -- '*.js')
      - name: Validate scripts, tests, and release archive
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy/remote_deploy.sh scripts/deploy/remote_rollback.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/deploy/package_site.py --out "$RUNNER_TEMP/site-release.tar.gz"
          tar -tzf "$RUNNER_TEMP/site-release.tar.gz" > /dev/null
